# ==============================================================
# Nginx — reverse proxy + TLS + serve file tĩnh cho production.
#
# Kiến trúc:
#   Internet :80/:443  →  nginx (container frontend)  →  backend :8080
#
# Nginx đứng ngoài cùng, đảm nhiệm:
#   • Redirect toàn bộ HTTP → HTTPS (trừ ACME challenge)
#   • TLS với chứng chỉ Let's Encrypt (certbot xin + gia hạn)
#   • Serve file tĩnh (Vite build)
#   • Reverse proxy /api/v1 → backend (REST + SSE)
#   • Reverse proxy /api/v1/ws → backend (WebSocket/SockJS)
#   • Redirect www → non-www
#   • Gzip, security headers, caching
#
# Chứng chỉ do certbot quản lý, mount vào /etc/letsencrypt.
# Tham chiếu biến môi trường qua envsubst (xem entrypoint Dockerfile).
# ==============================================================

# ---- HTTP → HTTPS redirect + ACME challenge ----
server {
    listen 80;
    server_name _;

    # Cho phép certbot xác thực quyền sở hữu domain
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Mọi request khác redirect sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- www → non-www redirect ----
server {
    listen 443 ssl;
    http2 on;
    server_name www.${APP_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${APP_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${APP_DOMAIN}/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://${APP_DOMAIN}$request_uri;
}

# ---- Main HTTPS server ----
server {
    listen 443 ssl;
    http2 on;
    server_name ${APP_DOMAIN};

    # ---- TLS ----
    ssl_certificate     /etc/letsencrypt/live/${APP_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${APP_DOMAIN}/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ---- Static files ----
    root /usr/share/nginx/html;
    index index.html;

    # DNS nội bộ Docker. Dùng biến $backend_host để nginx phân giải tên
    # lúc CÓ REQUEST — tránh crash khi backend chưa lên hoặc đổi IP.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_host backend;

    # Backend cho phép upload tối đa 10MB.
    client_max_body_size 10m;

    # ---- Gzip ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # ---- Security headers ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- Healthcheck cho Docker ----
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ---- Vite assets (có hash trong tên → cache vĩnh viễn) ----
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # ---- index.html — không được cache ----
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ---- SPA fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- WebSocket/SockJS cho Notification ----
    # Khai báo TRƯỚC /api/v1 vì cần header Upgrade riêng.
    location /api/v1/ws {
        proxy_pass http://$backend_host:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- REST API + SSE proxy ----
    location /api/v1 {
        proxy_pass http://$backend_host:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        # SSE (Server-Sent Events)
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }
}
