name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Huỷ các lần chạy cũ khi push liên tiếp vào cùng branch/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Xác định phần nào của repo bị thay đổi để chỉ chạy job cần thiết
  # ---------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  # ---------------------------------------------------------------
  # Backend: Spring Boot 3.4 / Java 21 / Maven
  # 239 unit test đều dùng Mockito nên KHÔNG cần Postgres/Redis/Kafka.
  # (240 khi tính cả SchemaMigrationTest)
  # Riêng SchemaMigrationTest cần Postgres -> dùng service container.
  # ---------------------------------------------------------------
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine # cùng version với production
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: storetest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven # cache ~/.m2 dựa trên pom.xml

      # TEST_DB_URL bật SchemaMigrationTest: chạy Flyway trên DB rỗng rồi
      # Hibernate validate -> fail ngay nếu entity và migration lệch nhau.
      - name: Run tests (unit + schema migration)
        run: ./mvnw -B --no-transfer-progress test
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/storetest
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: test

      - name: Package (skip tests, đã chạy ở bước trên)
        run: ./mvnw -B --no-transfer-progress package -DskipTests

      - name: Upload test report
        if: always() # upload cả khi test fail để debug
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # ---------------------------------------------------------------
  # Frontend: Vite + React 18 + TypeScript
  # ---------------------------------------------------------------
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22' # khớp với node:22-alpine trong frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Hiện code còn 66 lỗi eslint (chủ yếu no-explicit-any) -> để advisory,
      # bỏ continue-on-error sau khi đã dọn sạch để chặn PR làm hồi quy.
      - name: Lint (advisory)
        continue-on-error: true
        run: npm run lint

      # Vite dùng plugin-react-swc nên `npm run build` KHÔNG type-check.
      # Hiện có 17 lỗi type -> cũng để advisory, siết lại sau khi fix.
      - name: Type check (advisory)
        continue-on-error: true
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ---------------------------------------------------------------
  # Kiểm tra Dockerfile build được (không push image).
  # Chỉ chạy ở PR — push vào main đã có cd.yml build & push image thật.
  # ---------------------------------------------------------------
  docker-build:
    needs: [changes, backend, frontend]
    # always() để job vẫn chạy khi backend/frontend bị skip do paths-filter
    if: always() && github.event_name == 'pull_request' && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
