name: CD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy lên server sau khi push image?'
        type: boolean
        default: false

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false # không huỷ deploy đang chạy giữa đường

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------
  # Build & push image lên GitHub Container Registry (ghcr.io)
  # Không cần secret: dùng GITHUB_TOKEN có sẵn
  # ---------------------------------------------------------------
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # cần để push lên ghcr.io
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Biến VITE_* bị nhúng cứng vào bundle lúc build nên phải truyền ở đây,
      # không thể set lúc chạy container. Chỉnh domain tại Settings → Variables
      # (APP_DOMAIN) thay vì sửa Dockerfile.
      - name: Build args cho frontend
        id: buildargs
        if: matrix.name == 'frontend'
        run: |
          domain="${{ vars.APP_DOMAIN || 'trungduongauto.store' }}"
          {
            echo 'args<<EOF'
            echo "VITE_API_BASE_URL=/api/v1"
            echo "VITE_GOOGLE_REDIRECT_URI=https://${domain}/auth/google/callback"
            echo "VITE_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ steps.buildargs.outputs.args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ---------------------------------------------------------------
  # Deploy: SSH vào server, pull image mới và restart bằng docker compose
  # Chỉ chạy khi có tag v* hoặc bấm Run workflow với deploy=true
  # Yêu cầu secrets: SSH_HOST, SSH_USER, SSH_KEY (+ tuỳ chọn SSH_PORT)
  # và biến DEPLOY_PATH trỏ tới thư mục chứa docker-compose.prod.yml + .env.prod
  # ---------------------------------------------------------------
  deploy:
    needs: build-push
    if: startsWith(github.ref, 'refs/tags/v') || inputs.deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # để server `docker pull` được bằng GITHUB_TOKEN
    environment: production # bật "required reviewers" ở Settings để cần approve trước khi deploy
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true # dừng ngay khi một lệnh fail
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH || '/opt/auto_accessories_store' }}
            # Chốt chặn cho lần đổi tên .env -> .env.prod. Thiếu file này thì
            # mọi ${...} trong compose phân giải thành chuỗi rỗng và container
            # dựng lên với mật khẩu trống — hỏng im lặng. Thà dừng deploy, giữ
            # nguyên container đang chạy, còn hơn.
            if [ ! -f .env.prod ]; then
              echo "Khong tim thay .env.prod trong $(pwd)"
              if [ -f .env ]; then
                echo "Van con file .env cu. Chay MOT LAN tren server:  mv .env .env.prod"
              fi
              exit 1
            fi
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose --env-file .env.prod -f docker-compose.prod.yml pull
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            docker compose --env-file .env.prod -f docker-compose.prod.yml ps

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://${{ vars.APP_DOMAIN || 'trungduongauto.store' }}/api/v1/actuator/health" | grep -q '"status":"UP"'; then
              echo "Backend UP"; exit 0
            fi
            echo "Chờ backend khởi động... ($i/20)"; sleep 10
          done
          echo "Health check thất bại"; exit 1
