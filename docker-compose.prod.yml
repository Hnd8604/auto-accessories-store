# ==============================================================
# Compose dùng trên SERVER (production).
# Khác docker-compose.yml (dev): dùng image đã build sẵn trên
# ghcr.io thay vì build tại chỗ -> deploy chỉ mất vài giây.
#
# Trên server cần đúng 2 file: docker-compose.prod.yml và .env.prod
#
# ⚠️ ĐỔI TÊN: file env của prod trước đây là `.env`, nay là `.env.prod` cho đối
#    xứng với `.env.dev` của máy local. Trên VPS phải `mv .env .env.prod` MỘT LẦN
#    trước lần deploy kế tiếp, nếu không compose sẽ dựng container với biến rỗng.
#
#   docker compose --env-file .env.prod -f docker-compose.prod.yml pull
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#
# Đặt IMAGE_OWNER=<github-user>/<repo> trong .env.prod, ví dụ:
#   IMAGE_OWNER=hnd8604/auto-accessories-store   ← dùng dấu gạch ngang (ghcr.io tự đổi _ thành -)
#   IMAGE_TAG=latest
#
# Lần deploy ĐẦU TIÊN (database còn rỗng) .env.prod bắt buộc phải có
# ADMIN_PASSWORD, nếu không backend sẽ dừng khởi động kèm thông báo rõ ràng.
# Các lần deploy sau tài khoản đã tồn tại nên biến này không còn cần nữa.
# ==============================================================

# Tên project pin cứng. Không khai thì Compose suy ra từ tên thư mục deploy,
# nghĩa là đổi DEPLOY_PATH là volume đổi tên theo và DATABASE PRODUCTION coi
# như biến mất. Giá trị này khớp đúng tên đang chạy trên VPS hiện tại
# (kiểm tra bằng `docker compose ls`), nên khai vào đây là no-op an toàn.
name: auto_accessories_store

services:
  postgres:
    container_name: postgres
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  redis:
    container_name: redis
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"   
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    # Healthcheck bên dưới dùng $$REDIS_PASSWORD -> biến này phải tồn tại
    # BÊN TRONG container. Thiếu dòng này healthcheck luôn WRONGPASS,
    # redis mãi unhealthy và backend không bao giờ được khởi động.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a $$REDIS_PASSWORD ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }


  backend:
    container_name: store-backend
    image: ghcr.io/${IMAGE_OWNER}-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # env_file (.env.prod) nạp toàn bộ JWT_SIGNER_KEY / MAIL_* / CLOUDINARY_* / SEPAY_* /
    # GOOGLE_* mà application.yaml đọc qua ${...}. Thiếu env_file thì app
    # không khởi động được.
    env_file: .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks: [backend]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- http://127.0.0.1:8080/api/v1/actuator/health
          | grep -q '"status":"UP"'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  # Nginx đứng ngoài cùng: TLS, serve file tĩnh, proxy /api/v1.
  # Chứng chỉ Let's Encrypt do certbot quản lý (service bên dưới).
  # Port 80 bắt buộc mở kể cả khi chỉ dùng HTTPS vì ACME cần nó.
  frontend:
    container_name: store-frontend
    image: ghcr.io/${IMAGE_OWNER}-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - '80:80'
      - '443:443'
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      # Chứng chỉ Let's Encrypt. PHẢI persist, nếu mất thì mỗi lần deploy
      # lại xin chứng chỉ mới và sẽ dính rate limit (5 lần/domain/tuần).
      - certbot_etc:/etc/letsencrypt
      # Webroot cho ACME challenge — certbot ghi file xác thực vào đây,
      # nginx serve /.well-known/acme-challenge/ từ đây.
      - certbot_webroot:/var/www/certbot
    networks: [backend]
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # Certbot tự động gia hạn chứng chỉ Let's Encrypt.
  # Container chạy vòng lặp: renew → sleep 12h → renew → ...
  # Lần deploy ĐẦU TIÊN phải chạy thủ công `certbot certonly` (xem DEPLOY.md).
  certbot:
    container_name: certbot
    image: certbot/certbot:latest
    restart: unless-stopped
    depends_on: [frontend]
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet --deploy-hook 'echo Certificate renewed';
        sleep 12h & wait $${!};
      done"
    logging:
      driver: json-file
      options: { max-size: '5m', max-file: '2' }

volumes:
  postgres_data:
  redis_data:
  certbot_etc:
  certbot_webroot:

networks:
  backend:
    driver: bridge
