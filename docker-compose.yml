# ==============================================================
# Compose dùng khi DEV trên máy local — CHỈ hạ tầng.
#
# Backend chạy bằng `mvnw spring-boot:run`, frontend bằng `npm run dev`
# (xem run.ps1). File này chỉ dựng PostgreSQL + Redis cho chúng kết nối tới.
# Bản chạy trên server là docker-compose.prod.yml, hoàn toàn tách biệt.
#
#   docker compose --env-file .env.dev --profile infra up -d
#   docker compose --env-file .env.dev --profile tools up -d   # RedisInsight
#
# --env-file là BẮT BUỘC. File env của dev là .env.dev, của production là
# .env.prod (dùng bởi docker-compose.prod.yml trên VPS) — cả hai cùng nằm ở
# thư mục gốc này nên phải chỉ đích danh. Không truyền --env-file thì Compose
# đi tìm file tên `.env` trần và không thấy gì, mọi biến thành chuỗi rỗng.
#
# Trước đây file này còn `profile: app` build cả backend/frontend. Nó hỏng
# (thiếu env_file, map sai cổng, build ra URL của domain production) và trùng
# vai trò với docker-compose.prod.yml nên đã bỏ. Cần test image giống prod
# thì dùng thẳng docker-compose.prod.yml.
# ==============================================================

# Tên project pin cứng. Nếu không khai, Compose suy ra từ thư mục đang đứng —
# nghĩa là container/volume đổi tên theo chỗ gõ lệnh. Chạy từ backend/ sinh ra
# volume `backend_postgres_data`, chạy từ gốc sinh ra `auto_accessories_store_
# postgres_data`, và database dev cũ biến mất không dấu vết. Pin ở đây thì gõ
# lệnh ở đâu cũng ra đúng một project.
name: auto_accessories_store

services:

  # ======================== Infrastructure ========================

  postgres:
    container_name: postgres
    image: postgres:16-alpine
    restart: unless-stopped
    profiles:
      - infra
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    container_name: redis
    image: redis:7.4-alpine
    restart: unless-stopped
    profiles:
      - infra
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  # ======================== Dev Tools (optional) ========================
  # Start with: docker compose --profile tools up -d

  redisinsight:
    container_name: redisinsight
    image: redis/redisinsight:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - redisinsight_data:/data
    networks:
      - backend
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
  redisinsight_data:

networks:
  backend:
    driver: bridge
