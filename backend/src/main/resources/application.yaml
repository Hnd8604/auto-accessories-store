
server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  output.ansi.enabled: ALWAYS
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:store}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      # Schema do Flyway quản lý. `validate` chỉ đối chiếu entity với DB
      # rồi fail nếu lệch — KHÔNG bao giờ tự sửa schema nữa.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Cố tình để false: DB cũ do ddl-auto tạo có bảng "user" (sai tên) nên
    # KHÔNG được baseline đè lên. Xoá DB cũ và để Flyway dựng lại từ V1.
    baseline-on-migrate: false
    validate-on-migrate: true
  main:
    banner-mode: off
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 5s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 0
          max-wait: 2s
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}          # Google App Password (16 ký tự)
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: store-notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      missing-topics-fatal: false

logging:
  level:
    root: info
  file:
    name: ${LOG_PATH:../logs/backend}/backend.log
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_PATH:../logs/backend}/backend-%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 500MB

jwt:
  signerKey: ${JWT_SIGNER_KEY}               # Tạo bằng: openssl rand -base64 48
  access-duration: ${JWT_ACCESS_DURATION:3600}       # seconds (1 hour)
  refresh-duration: ${JWT_REFRESH_DURATION:2592000}  # seconds (30 days)

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# SePay Payment Gateway Configuration
sepay:
  api-key: ${SEPAY_API_KEY}
  bank-code: ${SEPAY_BANK_CODE:MBBank}
  bank-account-number: ${SEPAY_BANK_ACCOUNT_NUMBER}
  bank-account-name: ${SEPAY_BANK_ACCOUNT_NAME}
  bank-name: ${SEPAY_BANK_NAME:MB Bank}

# Google OAuth2 Configuration
# Lấy từ Google Cloud Console → APIs & Services → Credentials → OAuth 2.0 Client IDs
google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/auth/google/callback}

app:
  admin:
    # Tài khoản quản trị khởi tạo, CHỈ dùng khi database chưa có admin nào.
    # Bỏ trống ADMIN_PASSWORD ở profile dev thì dùng mặc định "admin";
    # ở profile khác (prod) app sẽ không khởi động cho tới khi set biến này.
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
    email: ${ADMIN_EMAIL:admin@gmail.com}
  kafka:
    topics:
      order-created: order.created
      order-status-changed: order.status.changed
